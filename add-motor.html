<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tambah Motor | RYOKOU</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="add-motor.css"></head>
<body><main class="add-page"><a href="motor-list.html" class="back-btn"><i class="bi bi-chevron-left"></i> Kembali</a><header class="add-title">Tambah Motor</header>
<form id="addMotorForm"><section class="motor-form-card"><div class="photo-column"><h2>Foto Motor</h2><label class="upload-box" for="motorPhoto"><img id="photoPreview" alt="" hidden><div id="uploadPrompt"><i class="bi bi-image"></i><i class="bi bi-arrow-up upload-arrow"></i><b>Unggah Foto Motor</b></div></label><input id="motorPhoto" type="file" accept="image/*" hidden></div>
<div class="input-column"><div class="form-field"><label for="motorName">Nama Motor</label><input id="motorName" placeholder="Masukan teks" required></div><div class="form-field"><label for="brand">Merek</label><input id="brand" placeholder="Masukan teks" required></div><div class="form-field"><label for="type">Tipe</label><input id="type" placeholder="EF102NTM2 A" required></div><div class="form-field"><label for="plate">No. Polisi</label><input id="plate" placeholder="N 1234 XXX" required></div></div></section>
<section class="bottom-form"><div class="bottom-field"><label for="year">Tahun</label><select id="year" required><option value="">Pilih Tahun</option></select></div><div class="bottom-field"><label for="price">Harga Per Hari</label><input id="price" type="number" min="1" placeholder="Rp 180.000" required></div><div class="status-field"><span>Status</span><div class="status-options"><label><input type="radio" name="status" value="Tersedia" checked><span>Tersedia</span></label><label><input type="radio" name="status" value="Disewa"><span>Disewa</span></label><label><input type="radio" name="status" value="Perbaikan"><span>Perbaikan</span></label></div></div><button class="save-btn" type="submit">Simpan</button></section></form></main><script src="add-motor.js"></script></body></html>
